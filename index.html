<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator cuz i was bored</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-container">
        <div class="calculator">
            <div class="display-screen">
                <div id="history" class="history"></div>
                <input type="text" id="display" readonly value="0">
            </div>
            
            <div class="buttons-grid">
                <!-- Row 1: Memory / Clear -->
                <button class="btn function" onclick="clearAll()">AC</button>
                <button class="btn function" onclick="deleteChar()">⌫</button>
                <button class="btn operator" onclick="appendValue('%')">%</button>
                <button class="btn operator" onclick="appendValue('/')">÷</button>

                <!-- Row 2: Advanced Math -->
                <button class="btn math" onclick="appendFunction('Math.sqrt(')">√</button>
                <button class="btn math" onclick="appendValue('^')">xʸ</button>
                <button class="btn math" onclick="appendValue('^2')">x²</button>
                <button class="btn operator" onclick="appendValue('*')">×</button>

                <!-- Row 3: Numbers 7-9 & Minus -->
                <button class="btn number" onclick="appendValue('7')">7</button>
                <button class="btn number" onclick="appendValue('8')">8</button>
                <button class="btn number" onclick="appendValue('9')">9</button>
                <button class="btn operator" onclick="appendValue('-')">-</button>

                <!-- Row 4: Numbers 4-6 & Plus -->
                <button class="btn number" onclick="appendValue('4')">4</button>
                <button class="btn number" onclick="appendValue('5')">5</button>
                <button class="btn number" onclick="appendValue('6')">6</button>
                <button class="btn operator" onclick="appendValue('+')">+</button>

                <!-- Row 5: Numbers 1-3 & Parentheses -->
                <button class="btn number" onclick="appendValue('1')">1</button>
                <button class="btn number" onclick="appendValue('2')">2</button>
                <button class="btn number" onclick="appendValue('3')">3</button>
                <button class="btn math" onclick="appendValue('(')">(</button>

                <!-- Row 6: Constants & 0 -->
                <button class="btn number" onclick="appendValue('0')">0</button>
                <button class="btn number" onclick="appendValue('.')">.</button>
                <button class="btn math" onclick="appendValue(')')">)</button>
                <button class="btn equals" onclick="calculate()">=</button>

                <!-- Row 7: Extra Symbols -->
                <button class="btn math" onclick="appendValue('3.14159265359')">π</button>
                <button class="btn math" onclick="appendValue('2.71828182846')">e</button>
                <button class="btn math" onclick="appendFunction('factorial(')">x!</button>
                <button class="btn math" onclick="appendFunction('Math.abs(')">|x|</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
